<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="20">
<title>DiDi-shop — обновляемся</title>
<style>
  /* Без внешних файлов: приложение в этот момент не отвечает. Цвета — палитра «Лайм-тек». */
  html { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #EBF1E2; color: #13261C;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 22rem; padding: 24px; text-align: center; }
  .mark { display: inline-block; padding: 8px 14px; border-radius: 12px; background: #C6F432; color: #13261C;
    font-weight: 800; letter-spacing: .02em; }
  h1 { margin: 20px 0 8px; font-size: 22px; line-height: 1.25; }
  p { margin: 0; }
  @media (prefers-color-scheme: dark) { body { background: #070E0A; color: #EEF5E9; } }
</style>
</head>
<body>
<main>
  <span class="mark">DiDi</span>
  <h1>Обновляем магазин</h1>
  <p>Это займёт около минуты. Страница откроется сама — корзина и заказы сохранены.</p>
</main>
</body>
</html>
