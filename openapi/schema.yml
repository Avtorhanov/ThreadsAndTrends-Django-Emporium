          type: string
          description: Цвет текста на акценте
      required:
      - color
      - key
      - name
      - 'on'
    ThemeModeEnum:
      enum:
      - system
      - light
      - dark
      type: string
      description: |-
        * `system` - Как в системе
        * `light` - Светлая
        * `dark` - Тёмная
    ThemePalette:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/PaletteKeyEnum'
        name:
          type: string
        group:
          $ref: '#/components/schemas/PaletteGroupEnum'
        note:
          type: string
        accent:
          type: string
          description: Цвет акцента — для образца
        brand:
          type: string
          description: Фирменный цвет — для образца
        bg_light:
          type: string
          description: Фон светлой темы
        bg_dark:
          type: string
          description: Фон тёмной темы
      required:
      - accent
      - bg_dark
      - bg_light
      - brand
      - group
      - key
      - name
      - note
    ThemeRadiusEnum:
      enum:
      - sharp
      - normal
      - soft
