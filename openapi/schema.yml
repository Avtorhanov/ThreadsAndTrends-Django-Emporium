openapi: 3.0.3
info:
  title: DiDi-shop API
  version: 1.0.0
  description: API маркетплейса DiDi-shop для мобильного приложения.
paths:
  /api/v1/admin/auth/csrf/:
    get:
      operationId: admin_csrf
      description: Выставляет cookie csrftoken для последующих POST-запросов панели.
      tags:
      - admin
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/admin/auth/login/:
    post:
      operationId: admin_login
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
          description: ''
  /api/v1/admin/auth/logout/:
    post:
      operationId: admin_logout
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      tags:
      - admin
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/admin/auth/me/:
    get:
      operationId: admin_me
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
          description: ''
  /api/v1/admin/catalog/categories/:
    get:
      operationId: admin_catalog_categories_list
      description: Все категории плоским списком (включая скрытые); дерево строит
        панель по parent.
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategory'
          description: ''
    post:
      operationId: admin_catalog_categories_create
      description: Все категории плоским списком (включая скрытые); дерево строит
        панель по parent.
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
          description: ''
  /api/v1/admin/catalog/categories/{id}/:
    get:
      operationId: admin_catalog_categories_retrieve
      description: Все категории плоским списком (включая скрытые); дерево строит
        панель по parent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
          description: ''
    patch:
      operationId: admin_catalog_categories_partial_update
      description: Все категории плоским списком (включая скрытые); дерево строит
        панель по parent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminCategoryRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
          description: ''
    delete:
      operationId: admin_catalog_categories_destroy
      description: 'Физическое удаление пустой категории. С товарами (в т.ч. удалёнными)
        или подкатегориями — 400: такую категорию можно только скрыть.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/catalog/images/{id}/:
    delete:
      operationId: admin_catalog_images_destroy
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Изображение товара.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Изображение и файл удалены
  /api/v1/admin/catalog/products/:
    get:
      operationId: admin_catalog_products_list
      description: Товары, включая скрытые и удалённые (фильтр status).
      parameters:
      - in: query
        name: category
        schema:
          type: integer
        description: id категории (с подкатегориями)
      - in: query
        name: label
        schema:
          type: string
        description: id статуса товара; none — без статуса
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию и артикулу
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - deleted
          - inactive
        description: По умолчанию — кроме удалённых
      - in: query
        name: stock
        schema:
          type: string
          enum:
          - in_stock
          - out_of_stock
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminProductList'
          description: ''
    post:
      operationId: admin_catalog_products_create
      description: Товары, включая скрытые и удалённые (фильтр status).
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
          description: ''
  /api/v1/admin/catalog/products/{id}/:
    get:
      operationId: admin_catalog_products_retrieve
      description: Товары, включая скрытые и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
          description: ''
    patch:
      operationId: admin_catalog_products_partial_update
      description: Товары, включая скрытые и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminProductUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
          description: ''
    delete:
      operationId: admin_catalog_products_destroy
      description: 'Мягкое удаление: товар пропадает с витрины, история заказов сохраняется.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/catalog/products/{id}/images/:
    post:
      operationId: admin_catalog_products_images_create
      description: Загрузить фото в конец галереи (JPEG/PNG/WebP, до 5 МБ, до 10 фото).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminImageUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImage'
          description: ''
  /api/v1/admin/catalog/products/{id}/images/reorder/:
    post:
      operationId: admin_catalog_products_images_reorder_create
      description: Новый порядок галереи; первое фото — обложка.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminImageReorderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminImage'
          description: ''
  /api/v1/admin/catalog/products/{id}/restore/:
    post:
      operationId: admin_catalog_products_restore_create
      description: Восстановить мягко удалённый товар.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
          description: ''
  /api/v1/admin/catalog/products/{id}/variants/:
    post:
      operationId: admin_catalog_products_variants_create
      description: Добавить вариант (размер). «Без размера» нельзя сочетать с размерами.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVariantRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVariant'
          description: ''
  /api/v1/admin/catalog/products/bulk/:
    post:
      operationId: admin_catalog_products_bulk_create
      description: 'Массово: статус, категория или видимость у отмеченных товаров
        (до 200).'
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductBulkRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductBulkResult'
          description: ''
  /api/v1/admin/catalog/statuses/:
    get:
      operationId: admin_catalog_statuses_list
      description: Справочник статусов товаров. Удаление снимает метку с товаров.
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProductStatus'
          description: ''
    post:
      operationId: admin_catalog_statuses_create
      description: Справочник статусов товаров. Удаление снимает метку с товаров.
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductStatusRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductStatus'
          description: ''
  /api/v1/admin/catalog/statuses/{id}/:
    patch:
      operationId: admin_catalog_statuses_partial_update
      description: Справочник статусов товаров. Удаление снимает метку с товаров.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Статус товара.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminProductStatusRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductStatus'
          description: ''
    delete:
      operationId: admin_catalog_statuses_destroy
      description: Справочник статусов товаров. Удаление снимает метку с товаров.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Статус товара.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/catalog/variants/{id}/:
    patch:
      operationId: admin_catalog_variants_partial_update
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Вариант товара.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminVariantRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVariant'
          description: ''
    delete:
      operationId: admin_catalog_variants_destroy
      description: Мягкое удаление. Последний вариант товара удалить нельзя (400).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Вариант товара.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/content/article-images/{id}/:
    delete:
      operationId: admin_content_article_images_destroy
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Фото статьи.
        required: true
      tags:
      - admin-content
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Фото и файл удалены
  /api/v1/admin/content/articles/:
    get:
      operationId: admin_content_articles_list
      description: Статьи, включая черновики и удалённые (фильтр status).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по заголовку
      - in: query
        name: status
        schema:
          type: string
          enum:
          - deleted
          - draft
          - published
        description: По умолчанию — кроме удалённых
      tags:
      - admin-content
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminArticleList'
          description: ''
    post:
      operationId: admin_content_articles_create
      description: Статьи, включая черновики и удалённые (фильтр status).
      tags:
      - admin-content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminArticleWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
          description: ''
  /api/v1/admin/content/articles/{id}/:
    get:
      operationId: admin_content_articles_retrieve
      description: Статьи, включая черновики и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Статья.
        required: true
      tags:
      - admin-content
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
          description: ''
    patch:
      operationId: admin_content_articles_partial_update
      description: Статьи, включая черновики и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Статья.
        required: true
      tags:
      - admin-content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminArticleWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
          description: ''
    delete:
      operationId: admin_content_articles_destroy
      description: 'Мягкое удаление: статья пропадает с сайта и из приложения.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Статья.
        required: true
      tags:
      - admin-content
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/content/articles/{id}/images/:
    post:
      operationId: admin_content_articles_images_create
      description: Загрузить фото в конец (JPEG/PNG/WebP, до 5 МБ, до 6 фото); первое
        — обложка.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Статья.
        required: true
      tags:
      - admin-content
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminArticleImageUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleImage'
          description: ''
  /api/v1/admin/content/articles/{id}/images/reorder/:
    post:
      operationId: admin_content_articles_images_reorder_create
      description: Статьи, включая черновики и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Статья.
        required: true
      tags:
      - admin-content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminArticleImageReorderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminArticleImage'
          description: ''
  /api/v1/admin/content/articles/{id}/restore/:
    post:
      operationId: admin_content_articles_restore_create
      description: Статьи, включая черновики и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Статья.
        required: true
      tags:
      - admin-content
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleDetail'
          description: ''
  /api/v1/admin/content/blocks/:
    get:
      operationId: admin_content_blocks_list
      description: |-
        Блоки разделов «Контакты», «Помощь» и подвала. Первое изменение раздела переносит его
        значения по умолчанию в БД (customize) — дальше блоки меняются по id.
      parameters:
      - in: query
        name: area
        schema:
          type: string
          enum:
          - contacts
          - footer
          - help
        required: true
      tags:
      - admin-content
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminBlock'
          description: ''
    post:
      operationId: admin_content_blocks_create
      description: |-
        Блоки разделов «Контакты», «Помощь» и подвала. Первое изменение раздела переносит его
        значения по умолчанию в БД (customize) — дальше блоки меняются по id.
      tags:
      - admin-content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBlockRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlock'
          description: ''
  /api/v1/admin/content/blocks/{id}/:
    patch:
      operationId: admin_content_blocks_partial_update
      description: |-
        Блоки разделов «Контакты», «Помощь» и подвала. Первое изменение раздела переносит его
        значения по умолчанию в БД (customize) — дальше блоки меняются по id.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Блок сайта.
        required: true
      tags:
      - admin-content
      requestBody:
        content:
          application/json:
            schema:
