      properties:
        summary:
          $ref: '#/components/schemas/StaffLevelEnum'
        orders:
          $ref: '#/components/schemas/StaffLevelEnum'
        products:
          $ref: '#/components/schemas/StaffLevelEnum'
        categories:
          $ref: '#/components/schemas/StaffLevelEnum'
        articles:
          $ref: '#/components/schemas/StaffLevelEnum'
        storefront:
          $ref: '#/components/schemas/StaffLevelEnum'
        customers:
          $ref: '#/components/schemas/StaffLevelEnum'
    StaffUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
          title: Имя
        last_name:
          type: string
          readOnly: true
          title: Фамилия
        is_superuser:
          type: boolean
          readOnly: true
          title: Статус суперпользователя
          description: Указывает, что пользователь имеет все права без явного их назначения.
        is_owner:
          type: boolean
          readOnly: true
        permissions:
          allOf:
          - $ref: '#/components/schemas/StaffPermissions'
          readOnly: true
      required:
      - email
      - first_name
      - id
      - is_owner
      - is_superuser
      - last_name
      - permissions
    ThemeAccent:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        color:
          type: string
