openapi: 3.0.3
info:
  title: DiDi-shop API
  version: 1.0.0
  description: API маркетплейса DiDi-shop для мобильного приложения.
paths:
  /api/v1/admin/auth/csrf/:
    get:
      operationId: admin_csrf
      description: Выставляет cookie csrftoken для последующих POST-запросов панели.
      tags:
      - admin
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/admin/auth/login/:
    post:
      operationId: admin_login
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
          description: ''
  /api/v1/admin/auth/logout/:
    post:
      operationId: admin_logout
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      tags:
      - admin
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/admin/auth/me/:
    get:
      operationId: admin_me
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
          description: ''
  /api/v1/admin/catalog/categories/:
    get:
      operationId: admin_catalog_categories_list
      description: Все категории плоским списком (включая скрытые); дерево строит
        панель по parent.
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCategory'
          description: ''
    post:
      operationId: admin_catalog_categories_create
      description: Все категории плоским списком (включая скрытые); дерево строит
        панель по parent.
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCategoryRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
          description: ''
  /api/v1/admin/catalog/categories/{id}/:
    get:
      operationId: admin_catalog_categories_retrieve
      description: Все категории плоским списком (включая скрытые); дерево строит
        панель по parent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
          description: ''
    patch:
      operationId: admin_catalog_categories_partial_update
      description: Все категории плоским списком (включая скрытые); дерево строит
        панель по parent.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminCategoryRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
          description: ''
    delete:
      operationId: admin_catalog_categories_destroy
      description: 'Физическое удаление пустой категории. С товарами (в т.ч. удалёнными)
        или подкатегориями — 400: такую категорию можно только скрыть.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категория.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/catalog/images/{id}/:
    delete:
      operationId: admin_catalog_images_destroy
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Изображение товара.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Изображение и файл удалены
  /api/v1/admin/catalog/products/:
    get:
      operationId: admin_catalog_products_list
      description: Товары, включая скрытые и удалённые (фильтр status).
      parameters:
      - in: query
        name: category
        schema:
          type: integer
        description: id категории (с подкатегориями)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию и артикулу
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - deleted
          - inactive
        description: По умолчанию — кроме удалённых
      - in: query
        name: stock
        schema:
          type: string
          enum:
          - in_stock
          - out_of_stock
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminProductList'
          description: ''
    post:
      operationId: admin_catalog_products_create
      description: Товары, включая скрытые и удалённые (фильтр status).
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
          description: ''
  /api/v1/admin/catalog/products/{id}/:
    get:
      operationId: admin_catalog_products_retrieve
      description: Товары, включая скрытые и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
          description: ''
    patch:
      operationId: admin_catalog_products_partial_update
      description: Товары, включая скрытые и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminProductUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
          description: ''
    delete:
      operationId: admin_catalog_products_destroy
      description: 'Мягкое удаление: товар пропадает с витрины, история заказов сохраняется.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/catalog/products/{id}/images/:
    post:
      operationId: admin_catalog_products_images_create
      description: Товары, включая скрытые и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminImageUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImage'
          description: ''
  /api/v1/admin/catalog/products/{id}/images/reorder/:
    post:
      operationId: admin_catalog_products_images_reorder_create
      description: Товары, включая скрытые и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminImageReorderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminImageList'
          description: ''
  /api/v1/admin/catalog/products/{id}/restore/:
    post:
      operationId: admin_catalog_products_restore_create
      description: Товары, включая скрытые и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
          description: ''
  /api/v1/admin/catalog/products/{id}/variants/:
    post:
      operationId: admin_catalog_products_variants_create
      description: Товары, включая скрытые и удалённые (фильтр status).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Товар.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVariantRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVariant'
          description: ''
  /api/v1/admin/catalog/variants/{id}/:
    patch:
      operationId: admin_catalog_variants_partial_update
      description: |-
        API панели администратора: только сессия Django (+ CSRF) и роль администратора.
        JWT мобильного клиента не принимается.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Вариант товара.
        required: true
      tags:
      - admin-catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminVariantRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVariant'
          description: ''
    delete:
      operationId: admin_catalog_variants_destroy
      description: Мягкое удаление. Последний вариант товара удалить нельзя (400).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Вариант товара.
        required: true
      tags:
      - admin-catalog
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/customers/:
    get:
      operationId: admin_customers_list
      description: Клиенты магазина. Администраторы в выборку не попадают и через
        неё не изменяются.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по email, имени и фамилии
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - blocked
          - deleted
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerList'
          description: ''
  /api/v1/admin/customers/{id}/:
    get:
      operationId: admin_customers_retrieve
      description: Клиенты магазина. Администраторы в выборку не попадают и через
        неё не изменяются.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Пользователь.
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/admin/customers/{id}/block/:
    post:
      operationId: admin_customers_block_create
      description: Клиенты магазина. Администраторы в выборку не попадают и через
        неё не изменяются.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Пользователь.
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/admin/customers/{id}/delete/:
    post:
      operationId: admin_customers_delete_create
      description: Мягкое удаление с анонимизацией, как при удалении клиентом.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Пользователь.
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/admin/customers/{id}/unblock/:
    post:
      operationId: admin_customers_unblock_create
      description: Клиенты магазина. Администраторы в выборку не попадают и через
        неё не изменяются.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Пользователь.
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
        '401':
          description: Неверные данные
  /api/v1/auth/logout/:
    post:
      operationId: logout
      description: Отзыв refresh-токена текущего устройства. Работает и с истёкшим
        access.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: get_profile
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: update_profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/auth/me/delete/:
    post:
      operationId: delete_account
      description: Мягкое удаление с анонимизацией. Требуется текущий пароль.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change/:
    post:
      operationId: change_password
      description: Остальные устройства разлогиниваются; текущему выдаётся новая пара
        токенов.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: request_password_reset
      description: 'Всегда 202: ответ не раскрывает, зарегистрирован ли email.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetEmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: confirm_password_reset
      description: Новый пароль по коду из письма; все прежние сессии завершаются.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: refresh_tokens
      description: 'Ротация: старый refresh попадает в чёрный список, выдаётся новая
        пара.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          description: Токен отозван
  /api/v1/auth/register/:
    post:
      operationId: register
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_list
      description: 'Дерево активных категорий: корни с подкатегориями.'
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogCategoryTree'
          description: ''
  /api/v1/catalog/products/:
    get:
      operationId: catalog_products_list
      description: |-
        Публичное чтение (каталог): без аутентификации, чтобы просроченный JWT
        в заголовке не превращал открытый запрос в 401.
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Slug категории (с подкатегориями)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogProductList'
          description: ''
  /api/v1/catalog/products/{slug}/:
    get:
      operationId: catalog_products_retrieve
      description: |-
        Публичное чтение (каталог): без аутентификации, чтобы просроченный JWT
        в заголовке не превращал открытый запрос в 401.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductDetail'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: 503 и status=error, если какая-либо проверка не прошла.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    AdminCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 100
        slug:
          description: Пусто — сгенерировать из названия (только при создании).
          oneOf:
          - type: string
            maxLength: 120
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        parent:
          type: integer
          nullable: true
        position:
          type: integer
