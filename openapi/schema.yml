  /api/v1/orders/:
    get:
      operationId: orders_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderListList'
          description: ''
    post:
      operationId: orders_create
      description: Оформить заказ из всей корзины или одну позицию buy_now (корзина
        не меняется). Ошибки корзины (empty_cart, cart_changed) и изменение суммы
        (total_changed) — 400 с текстом для покупателя.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Уникальный ключ попытки оформления (8–64 символа: латиница,
          цифры, - и _). Повтор запроса с тем же ключом возвращает уже созданный заказ
          (200).'
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInputRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: Повтор с тем же ключом
  /api/v1/orders/{number}/:
    get:
      operationId: orders_retrieve
      parameters:
      - in: path
        name: number
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/{number}/cancel/:
    post:
      operationId: orders_cancel
      description: Отмена до отправки заказа. Остатки возвращаются на склад.
      parameters:
      - in: path
        name: number
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/{number}/pay/:
    post:
      operationId: orders_pay
      description: Ссылка на страницу оплаты онлайн-заказа в статусе «Ожидает оплаты».
        Повторный вызов возвращает ту же попытку оплаты, пока она не завершилась.
        Статус заказа меняется только по подтверждению провайдера.
      parameters:
      - in: path
        name: number
        schema:
          type: string
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentStartInputRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStart'
          description: ''
        '503':
          description: Провайдер временно недоступен — повторить позже
  /api/v1/orders/{number}/pay/refresh/:
    post:
      operationId: orders_pay_refresh
      description: Сверить оплату с провайдером (после возврата со страницы оплаты)
        и вернуть заказ.
      parameters:
      - in: path
        name: number
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '503':
          description: Провайдер временно недоступен — повторить позже
  /api/v1/orders/checkout/:
    get:
      operationId: orders_checkout_preview
      description: 'Данные экрана оформления: корзина (тот же расчёт, что и в заказе),
        способы доставки со стоимостью, способы оплаты и получатель из последнего
        заказа. С variant — одна позиция «Купить сейчас» вместо корзины.'
      parameters:
      - in: query
        name: quantity
        schema:
          type: integer
        description: '«Купить сейчас»: количество (1)'
      - in: query
        name: variant
        schema:
          type: integer
        description: '«Купить сейчас»: id варианта'
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutPreview'
          description: ''
