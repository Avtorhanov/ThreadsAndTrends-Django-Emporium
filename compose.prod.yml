# Продакшен: `./deploy.sh` (он же — обновление после `git pull`). Настройки — в .env
# (шаблон .env.prod.example). Наружу открыты только 80 и 443 (Caddy, автоматический HTTPS).
#
#   caddy      — HTTPS (Let's Encrypt), веб-версия приложения /app/, панель /panel/,
#                статика и фото товаров; остальное (веб-витрина, API) — в app
#   app        — Django + gunicorn; при старте: миграции, администратор, демо-каталог
#   worker     — фоновые задачи (письма, возвраты)
#   scheduler  — периодические задачи (автоотмена неоплаченных, сверка платежей)
#   db         — PostgreSQL 16
#   backup     — ежедневный бэкап БД и фото в ./backups
name: didi-shop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    args:
      REQUIREMENTS: prod
  image: didi-shop-app:latest
  restart: unless-stopped
  logging: *logging
  env_file: .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: myshop.settings.prod
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: didi
    DB_USER: didi
    # Явно, а не только из env_file: тот же источник, что у POSTGRES_PASSWORD сервиса db
    # (переменная окружения оболочки иначе переопределила бы пароль только для базы).
    DB_PASSWORD: ${DB_PASSWORD:?Запускайте через ./deploy.sh}
    # Производные от DOMAIN — в .env их задавать не нужно. SITE_HOSTS и RETURN_URL_PREFIXES
    # пишет deploy.sh: основной адрес + прежние (EXTRA_DOMAINS), чтобы старые APK работали.
    ALLOWED_HOSTS: ${SITE_HOSTS:?Запускайте через ./deploy.sh}
    CSRF_TRUSTED_ORIGINS: https://${DOMAIN:?Запускайте через ./deploy.sh}
    NUM_PROXIES: "1"
    # Возврат со страницы оплаты: в приложение (didishop://) и на веб-витрину.
    PAYMENTS_RETURN_URL_PREFIXES: didishop://,${RETURN_URL_PREFIXES:?Запускайте через ./deploy.sh}
    PAYMENTS_DEFAULT_RETURN_URL: https://${DOMAIN}/app/orders/{number}
    # Основной адрес веб-витрины: canonical, sitemap.xml, Open Graph (прежние адреса работают,
    # но поисковики видят один).
    SITE_URL: https://${DOMAIN}
    CACHE_URL: ${CACHE_URL:-db://django_cache}
    TASKS_BACKEND: database
  volumes:
    - media:/data/media
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: didi
      POSTGRES_USER: didi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U didi -d didi"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256m

  app:
    <<: *app
    # Стартует от root только чтобы выставить владельца томов, затем работает от app
    # (docker/entrypoint.sh).
    user: root
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
      ENSURE_ADMIN: "1"
      LOAD_FIXTURES: ${SEED_DEMO:-0}
      STATIC_EXPORT_DIR: /srv/static
      GUNICORN_CMD_ARGS: --workers ${GUNICORN_WORKERS:-3} --timeout 60 --graceful-timeout 30
    volumes:
      - media:/data/media
      - static:/srv/static
    healthcheck:
      # Host — домен сайта: запрос проходит ALLOWED_HOSTS; healthcheck исключён из редиректа на HTTPS.
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/v1/health/', headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0]}), timeout=5)"
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5

  worker:
    <<: *app
    command: python manage.py db_worker --queue-name '*'
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: python manage.py run_scheduler
    depends_on:
      app:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: deploy/edge.Dockerfile
      args:
        # Ссылка «Скачать приложение для Android» в веб-версии (пусто — не показывать).
        ANDROID_APK_URL: ${ANDROID_APK_URL:-}
    image: didi-shop-edge:latest
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESSES: ${SITE_HOSTS}
      ACME_EMAIL: ${ACME_EMAIL:-${ADMIN_EMAIL:-}}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: db
      PGUSER: didi
      PGDATABASE: didi
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Время по UTC: 00:30 UTC = 03:30 МСК.
      BACKUP_CRON: ${BACKUP_CRON:-30 0 * * *}
    volumes:
      - ./backups:/backups
      - media:/media:ro
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "-c", "echo \"$$BACKUP_CRON sh /usr/local/bin/backup.sh > /proc/1/fd/1 2>&1\" | crontab - && exec crond -f -d 8"]
    # После app: бэкап имеет смысл, когда база уже мигрирована.
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
