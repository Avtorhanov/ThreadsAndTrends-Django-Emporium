name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: didi
          POSTGRES_USER: didi
          POSTGRES_PASSWORD: didi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U didi -d didi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_NAME: didi
      DB_USER: didi
      DB_PASSWORD: didi
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.test
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.test
      - name: Tests
        run: pytest
      - name: Prod settings load and pass deploy checks
        run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.prod
          SECRET_KEY: ci-deploy-check-${{ github.run_id }}-not-a-real-secret-key-0123456789
          ALLOWED_HOSTS: example.com

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build prod image
        run: docker build --build-arg REQUIREMENTS=prod -t didi-shop:ci .
