name: CI

on:
  push:
    branches: [main, master, "session-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: didi
          POSTGRES_USER: didi
          POSTGRES_PASSWORD: didi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U didi -d didi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_NAME: didi
      DB_USER: didi
      DB_PASSWORD: didi
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.test
      - name: OpenAPI schema is valid and committed (openapi/schema.yml)
        run: |
          python manage.py spectacular --validate --fail-on-warn --file openapi/schema.yml
          git diff --exit-code openapi/schema.yml || {
            echo "::error file=openapi/schema.yml::Схема устарела: python manage.py spectacular --file openapi/schema.yml"
            exit 1
          }
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.test
      - name: Tests
        run: pytest
      - name: Prod settings load and pass deploy checks
        run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.prod
          SECRET_KEY: ci-deploy-check-${{ github.run_id }}-not-a-real-secret-key-0123456789
          ALLOWED_HOSTS: example.com

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, admin-panel]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      # Типы API генерируются из openapi/schema.yml перед проверкой (pretypecheck).
      - run: npm run typecheck
      - name: Build
        if: matrix.app == 'admin-panel'
        run: npm run build
      - name: npm error details
        if: failure()
        run: |
          log=$(ls -t ~/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1)
          [ -n "$log" ] || exit 0
          msg=$(grep -E "error|ERR" "$log" | tail -n 40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=npm (${{ matrix.app }})::$msg"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose config -q
      - name: Build prod image
        run: docker build --build-arg REQUIREMENTS=prod -t didi-shop:ci .
      - name: Dev stack starts (docker compose up)
        run: |
          docker compose up -d --build --wait --wait-timeout 240 web
          curl -fsS http://localhost:8000/api/v1/health/
          docker compose exec -T web python manage.py shell -c "from store.models import Product; assert Product.objects.count() > 0"
          docker compose up -d worker scheduler
          sleep 10
          docker compose ps
          test "$(docker compose ps --status running -q worker scheduler | wc -l)" -eq 2
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop dev stack
        if: always()
        run: docker compose down -v
