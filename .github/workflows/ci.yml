# Ветки: main — основа (только через PR), dev — функционал, visual — внешний вид.
# Полный CI — на push в main и dev и на каждый PR (в том числе visual → main).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .
      # Токены «Лайм-тек»: mobile/src/theme/tokens.ts и tokens.css актуальны, контраст ≥ 4.5:1.
      - name: Design tokens are generated and accessible
        run: python3 scripts/gen_tokens.py --check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: didi
          POSTGRES_USER: didi
          POSTGRES_PASSWORD: didi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U didi -d didi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_NAME: didi
      DB_USER: didi
      DB_PASSWORD: didi
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.test
      - name: OpenAPI schema is valid and committed (openapi/schema.yml)
        run: |
          mkdir -p ci-report
          python manage.py spectacular --validate --fail-on-warn --file openapi/schema.yml 2>&1 | tee ci-report/schema.log; test ${PIPESTATUS[0]} -eq 0
          git diff openapi/schema.yml > ci-report/schema.diff
          git diff --exit-code openapi/schema.yml || {
            echo "::error file=openapi/schema.yml::Схема устарела: python manage.py spectacular --file openapi/schema.yml"
            exit 1
          }
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.test
      - name: Tests
        run: |
          mkdir -p ci-report
          pytest 2>&1 | tee ci-report/pytest.log; exit ${PIPESTATUS[0]}
      - name: Prod settings load and pass deploy checks
        run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.prod
          SECRET_KEY: ci-deploy-check-${{ github.run_id }}-not-a-real-secret-key-0123456789
          ALLOWED_HOSTS: example.com
      # Журналы — в служебную ветку: журналы Actions доступны не всем инструментам,
      # а ветку можно прочитать обычным git fetch (как ci-report-visual у превью).
      - name: Publish report branch
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publish-report.sh ci-report test

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, admin-panel]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      # Типы API генерируются из openapi/schema.yml перед проверкой (pretypecheck).
      - run: npm run typecheck
      - name: Build
        if: matrix.app == 'admin-panel'
        run: npm run build
      - name: npm error details
        if: failure()
        run: |
          log=$(ls -t ~/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1)
          [ -n "$log" ] || exit 0
          msg=$(grep -E "error|ERR" "$log" | tail -n 40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=npm (${{ matrix.app }})::$msg"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose config -q
      - name: Build prod image
        run: docker build --build-arg REQUIREMENTS=prod -t didi-shop:ci .
      - name: Dev stack starts (docker compose up)
        run: |
          docker compose up -d --build --wait --wait-timeout 240 web
          curl -fsS http://localhost:8000/api/v1/health/
          docker compose exec -T web python manage.py shell -c "from store.models import Product; assert Product.objects.count() > 0"
          docker compose up -d worker scheduler
          sleep 10
          docker compose ps
          test "$(docker compose ps --status running -q worker scheduler | wc -l)" -eq 2
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop dev stack
        if: always()
        run: docker compose down -v

  # Продакшен-стек одной командой (./deploy.sh, DOMAIN=localhost): HTTPS, PWA, фото каталога,
  # check --deploy, нагрузочный smoke оформления, бэкап → восстановление, браузерный сценарий
  # покупателя и администратора. Скриншоты — в артефакте e2e-report.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: deploy.sh → проверки → браузер
        run: bash deploy/e2e.sh e2e-report
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f compose.prod.yml logs --no-color --tail 200
      - name: Publish report branch
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publish-report.sh e2e-report e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e-report
          retention-days: 14
