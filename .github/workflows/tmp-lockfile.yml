# Временный: пересобирает admin-panel/package-lock.json и коммитит в ветку. Удаляется до мёржа.
name: Regenerate admin-panel lockfile

on:
  push:
    branches: [session-2-users-roles]
    paths: [.github/workflows/tmp-lockfile.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --package-lock-only
        working-directory: admin-panel
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add admin-panel/package-lock.json
          git commit -m "admin-panel: lock-файл с TypeScript 6"
          git push
