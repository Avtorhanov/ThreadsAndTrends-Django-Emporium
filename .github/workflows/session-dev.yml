# ВРЕМЕННЫЙ workflow сессии 9 (удалить до мёржа PR): среда сессии не скачивает артефакты
# Actions, поэтому отчёт e2e (скриншоты витрины, Lighthouse) публикуется в ветку
# ci-report-session-9.
name: session-dev

on:
  push:
    branches: ["session-9-*"]

permissions:
  contents: write

concurrency:
  group: session-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: E2E прод-стека с витриной
        id: e2e
        continue-on-error: true
        run: bash deploy/e2e.sh e2e-report
      - name: Логи стека
        if: always()
        run: docker compose -f compose.prod.yml logs --no-color --tail 300 > e2e-report/compose.log 2>&1 || true
      - name: Отчёт в ветку ci-report-session-9
        if: always()
        run: |
          cd e2e-report
          echo "${{ steps.e2e.outcome }} ${{ github.sha }}" > STATUS
          git init -q
          git checkout -q -b ci-report-session-9
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "e2e ${{ github.sha }}: ${{ steps.e2e.outcome }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report-session-9
      - name: Итог
        if: steps.e2e.outcome != 'success'
        run: exit 1
