# ВРЕМЕННЫЙ: публикует скриншоты e2e указанного прогона (ci-dev/run-id) в ветку
# ci-report-session-8 — в среде разработки артефакты не скачиваются. Удаляется до мёржа.
name: session-dev
on:
  push:
    branches: ["session-8-*"]
    paths: ["ci-dev/**"]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: run
        run: echo "id=$(cat ci-dev/run-id)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          name: e2e-report
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: /tmp/report/e2e
      - run: |
          cd /tmp/report
          git init -q -b ci-report-session-8
          git config user.name session-dev && git config user.email session-dev@users.noreply.github.com
          echo "${{ steps.run.outputs.id }}" > SOURCE_RUN
          git add -A && git commit -qm "e2e ${{ steps.run.outputs.id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report-session-8
