# Временный workflow сессии 6 (среда разработки без PyPI/npm и без доступа к логам Actions):
# ставит недостающую зависимость приложения (expo install), форматирует код ruff, регенерирует
# openapi/schema.yml и коммитит это в рабочую ветку; гоняет проверки и выкладывает вывод
# в ветку ci-report-session-6. Удаляется до мёржа.
name: session-dev

on:
  push:
    branches: ["session-6-*"]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[auto]')"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: didi
          POSTGRES_USER: didi
          POSTGRES_PASSWORD: didi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U didi -d didi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_NAME: didi
      DB_USER: didi
      DB_PASSWORD: didi
      DB_HOST: localhost
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: myshop.settings.test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -r requirements/dev.txt
      - name: Collect report
        run: |
          set +e  # каждая проверка пишет свой код выхода в отчёт, сбой одной не прерывает остальные
          mkdir -p /tmp/report
          echo "${GITHUB_SHA}" > /tmp/report/sha.txt
          # Недостающая зависимость приложения ставится версией, совместимой с Expo SDK.
          if ! grep -q '"expo-web-browser"' mobile/package.json; then
            (cd mobile && npm ci --no-audit --no-fund && npx expo install expo-web-browser) > /tmp/report/expo-install.txt 2>&1; echo "exit=$?" >> /tmp/report/expo-install.txt
          fi
          ruff check --fix . > /tmp/report/ruff.txt 2>&1; echo "check exit=$?" >> /tmp/report/ruff.txt
          ruff format . >> /tmp/report/ruff.txt 2>&1; echo "format exit=$?" >> /tmp/report/ruff.txt
          ruff check . >> /tmp/report/ruff.txt 2>&1; echo "recheck exit=$?" >> /tmp/report/ruff.txt
          python manage.py makemigrations --check --dry-run -v 3 > /tmp/report/migrations.txt 2>&1; echo "exit=$?" >> /tmp/report/migrations.txt
          python manage.py spectacular --validate --fail-on-warn --file openapi/schema.yml > /tmp/report/schema.txt 2>&1; echo "exit=$?" >> /tmp/report/schema.txt
          if ! grep -q "exit=0" /tmp/report/schema.txt; then
            python manage.py spectacular --file openapi/schema.yml >> /tmp/report/schema.txt 2>&1 || true
          fi
          pytest -q -p no:cacheprovider --tb=short -rfE > /tmp/report/pytest.txt 2>&1; echo "exit=$?" >> /tmp/report/pytest.txt
          for app in mobile admin-panel; do
            (cd $app && npm ci --no-audit --no-fund > /tmp/report/npm-$app.txt 2>&1 && npm run typecheck > /tmp/report/typecheck-$app.txt 2>&1; echo "exit=$?" >> /tmp/report/typecheck-$app.txt)
          done
          (cd admin-panel && npx vite build > /tmp/report/build-admin-panel.txt 2>&1; echo "exit=$?" >> /tmp/report/build-admin-panel.txt)
          DJANGO_SETTINGS_MODULE=myshop.settings.prod SECRET_KEY=ci-deploy-check-not-a-real-secret-key-0123456789-abcdefgh ALLOWED_HOSTS=example.com \
            python manage.py check --deploy > /tmp/report/deploy-check.txt 2>&1; echo "exit=$?" >> /tmp/report/deploy-check.txt
          git status --short > /tmp/report/changed.txt
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!mobile/node_modules' ':!admin-panel/node_modules' ':!admin-panel/dist' ':!mobile/src/api/schema.d.ts' ':!admin-panel/src/api/schema.d.ts'
          if ! git diff --cached --quiet; then
            git commit -m "ruff, openapi/schema.yml, зависимости приложения [auto]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          # Отчёт — отдельной веткой без истории, через те же учётные данные origin.
          export GIT_INDEX_FILE=/tmp/report-index
          git --work-tree=/tmp/report add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "report ${GITHUB_SHA}")
          git push -f origin "$commit:refs/heads/ci-report-session-6"
