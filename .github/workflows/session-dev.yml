# ВРЕМЕННЫЙ workflow сессии 8: в среде разработки нет доступа к npm, поэтому установка
# зависимостей, typecheck и сборки запускаются здесь, а отчёт (ci-dev/out) публикуется
# в ветку ci-report-session-8. Удаляется до мёржа в main.
name: session-dev

on:
  push:
    branches: ["session-8-*"]
    paths: ["ci-dev/**"]

concurrency:
  group: session-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ci-dev/run.sh
        run: |
          mkdir -p ci-dev/out
          set +e
          bash ci-dev/run.sh > ci-dev/out/log.txt 2>&1
          echo "exit=$?" >> ci-dev/out/log.txt
          tail -n 60 ci-dev/out/log.txt
      - name: Publish report to ci-report-session-8
        if: always()
        run: |
          cp -r ci-dev/out /tmp/report
          cd /tmp/report
          git init -q -b ci-report-session-8
          git config user.name "session-dev"
          git config user.email "session-dev@users.noreply.github.com"
          echo "${{ github.sha }}" > SOURCE_SHA
          git add -A
          git commit -qm "report for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report-session-8
