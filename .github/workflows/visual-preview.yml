# Визуальное превью витрины на GitHub Pages: все «комнаты» сайта статичными страницами
# (deploy/preview/build.py) и панель администратора (/panel/, ответы API из снимка),
# проверка в браузере и публикация в ветку gh-pages.
# Pages: Settings → Pages → Build and deployment → Deploy from a branch → gh-pages / (root).
# Запускается на push в visual; фичу из dev можно посмотреть ручным запуском (Run workflow → dev).
name: Visual preview

on:
  push:
    branches: [visual]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: didi
          POSTGRES_USER: didi
          POSTGRES_PASSWORD: didi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U didi -d didi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_NAME: didi
      DB_USER: didi
      DB_PASSWORD: didi
      DB_HOST: localhost
      DB_PORT: "5432"
      PREVIEW_BASE: /${{ github.event.repository.name }}
      PREVIEW_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/base.txt playwright
      - run: python -m playwright install --with-deps chromium
      # Панель администратора — настоящая сборка в режиме превью (ответы API из снимка).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - name: Build admin panel (preview mode)
        working-directory: admin-panel
        env:
          VITE_PREVIEW: "1"
          VITE_BASE: ${{ env.PREVIEW_BASE }}/panel/
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build preview
        run: |
          mkdir -p preview-shots
          python deploy/preview/build.py _site 2>&1 | tee preview-shots/build.log; exit ${PIPESTATUS[0]}
      - name: Check preview in browser
        run: python deploy/preview/check.py _site preview-shots 2>&1 | tee preview-shots/check.log; exit ${PIPESTATUS[0]}
      # Отчёт (журналы и скриншоты) — в служебную ветку: журналы Actions доступны не всем
      # инструментам, а ветку можно прочитать обычным git fetch.
      - name: Publish report branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd preview-shots
          git init -q -b report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Отчёт превью ${GITHUB_SHA::7}" || exit 0
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-report-visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-shots
          path: preview-shots
          retention-days: 14
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Превью: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "### Превью: ${PREVIEW_SITE_URL}/" >> "$GITHUB_STEP_SUMMARY"
          echo "Все комнаты: ${PREVIEW_SITE_URL}/rooms/" >> "$GITHUB_STEP_SUMMARY"
