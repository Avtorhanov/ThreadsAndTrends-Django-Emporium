# Одноразовый: генерирует каркасы mobile/ и admin-panel/ с lock-файлами и коммитит их в ветку.
# Удаляется перед мёржем сессии 2.
name: Bootstrap frontend

on:
  push:
    branches: [session-2-users-roles]
    paths: [.github/workflows/bootstrap-frontend.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python package versions
        run: |
          for p in djangorestframework-simplejwt djangorestframework drf-spectacular Django; do
            pip index versions "$p" 2>/dev/null | head -1
          done > versions.txt
          cat versions.txt

      - name: Expo app
        if: hashFiles('mobile/package.json') == ''
        env:
          CI: "1"
        run: |
          npx --yes create-expo-app@latest mobile --template blank-typescript
          cd mobile
          npx expo install expo-router expo-secure-store expo-linking expo-constants \
            react-native-safe-area-context react-native-screens
          npm install openapi-fetch
          npm install -D openapi-typescript
          rm -rf node_modules

      - name: Admin panel (React + Vite)
        if: hashFiles('admin-panel/package.json') == ''
        run: |
          mkdir admin-panel && cd admin-panel
          npm init -y >/dev/null
          npm install react react-dom react-router openapi-fetch
          npm install -D vite @vitejs/plugin-react typescript @types/react @types/react-dom openapi-typescript
          rm -rf node_modules

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add versions.txt mobile admin-panel
          git commit -m "Bootstrap: каркасы mobile/ и admin-panel/ с lock-файлами"
          git push
