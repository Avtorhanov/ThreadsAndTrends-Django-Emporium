# Одноразовый: генерирует каркасы mobile/ и admin-panel/ с lock-файлами и коммитит их в ветку.
# Удаляется перед мёржем сессии 2.
name: Bootstrap frontend

on:
  push:
    branches: [session-2-users-roles]
    paths: [.github/workflows/bootstrap-frontend.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Versions
        run: |
          { echo "simplejwt: $(pip index versions djangorestframework-simplejwt 2>/dev/null | sed -n 1p || true)"
            echo "expo: $(npm view expo version || true)"; } > versions.txt || true
          cat versions.txt
          echo "::notice title=versions::$(tr '\n' ';' < versions.txt)"

      - name: Expo app
        if: hashFiles('mobile/package.json') == ''
        env:
          CI: "1"
        run: |
          set -o pipefail
          {
            npx --yes create-expo-app@latest mobile --template blank-typescript --no-install
            cd mobile
            npm install
            npx expo install expo-router expo-secure-store expo-linking expo-constants \
              react-native-safe-area-context react-native-screens
            npm install openapi-fetch
            npm install -D openapi-typescript
            rm -rf node_modules
          } 2>&1 | tee /tmp/expo.log

      - name: Admin panel (React + Vite)
        if: hashFiles('admin-panel/package.json') == ''
        run: |
          set -o pipefail
          {
            mkdir admin-panel && cd admin-panel
            npm init -y >/dev/null
            npm install react react-dom react-router openapi-fetch
            npm install -D vite @vitejs/plugin-react typescript @types/react @types/react-dom openapi-typescript
            rm -rf node_modules
          } 2>&1 | tee /tmp/panel.log

      - name: Report failure
        if: failure()
        run: |
          for f in /tmp/expo.log /tmp/panel.log; do
            [ -f "$f" ] || continue
            msg=$(tail -c 6000 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$(basename $f)::$msg"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add versions.txt mobile admin-panel
          git commit -m "Bootstrap: каркасы mobile/ и admin-panel/ с lock-файлами"
          git push
