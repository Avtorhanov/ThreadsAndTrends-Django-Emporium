{% if messages %}
<div class="flash" role="status">
  {% for message in messages %}
  <p class="note note--{% if message.level_tag == 'error' %}danger{% elif message.level_tag == 'warning' %}warning{% elif message.level_tag == 'success' %}success{% else %}info{% endif %}">
    {{ message }}{% if message.message == "Добавлено в корзину" %} · <a href="{% url 'web:cart' %}">Перейти в корзину</a>{% endif %}
  </p>
  {% endfor %}
</div>
{% endif %}
